name: MiTV Home candidate
on:
  push:
    branches: [mitv-home]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mitv-home-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mitv: [false, true]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        shell: bash
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Test, lint and assemble
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache --max-workers=2 -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" -PmitvHome=${{ matrix.mitv }} :app:testStandardReleaseUnitTest :app:lintStandardRelease :app:assembleStandardRelease
      - name: Verify candidate APK
        if: matrix.mitv
        shell: bash
        run: |
          mkdir -p candidate
          cp app/build/outputs/apk/standard/release/app-standard-release.apk candidate/aerial-mitv-test1.apk
          cp docs/MITV-HOME.md candidate/README.md
          APK=candidate/aerial-mitv-test1.apk
          ANALYZER="${ANDROID_HOME}/cmdline-tools/latest/bin/apkanalyzer"
          test "$("$ANALYZER" manifest application-id "$APK")" = "com.ts.launcher"
          "$ANALYZER" manifest print "$APK" > candidate/manifest.xml
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > candidate/signature.txt
          python3 tools/verify-mitv-apk.py "$APK"
          git rev-parse HEAD > candidate/commit.txt
          cd candidate
          sha256sum aerial-mitv-test1.apk aerial-mitv-test1.dm > SHA256SUMS
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-reports-mitv-${{ matrix.mitv }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-standardRelease.*
          retention-days: 14
          if-no-files-found: warn
      - name: Upload candidate
        if: matrix.mitv && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aerial-mitv-test1
          path: candidate/
          retention-days: 30
          if-no-files-found: error
